<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator - Xtron</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            padding: 0;
            background: linear-gradient(45deg, #0f0c20, #150030, #2c003e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .calculator {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            min-width: 0;
            min-height: 0;
            background: rgba(18, 12, 31, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            padding: 20px 15px 30px;
        }

        .display {
            width: 100%;
            height: 22vh;
            min-width: 0;
            min-height: 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .display .input-history {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            min-height: 30px;
            max-height: 45%;
            overflow-x: hidden;
            overflow-y: auto;
            font-size: clamp(1rem, 4vw, 1.5rem);
            color: #b0a8cf;
            overflow-wrap: anywhere;
            word-break: break-all;
            white-space: normal;
            text-align: right;
            opacity: 0.8;
        }

        .display .output-result {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            min-height: 0;
            max-height: 60%;
            overflow-x: hidden;
            overflow-y: auto;
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: bold;
            color: #ffffff;
            margin-top: 5px;
            overflow-wrap: anywhere;
            word-break: break-all;
            white-space: normal;
            text-align: right;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            scroll-behavior: smooth;
        }

        .buttons-area {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 15px;
            flex-grow: 1;
            min-height: 0;
            margin-bottom: 5px;
        }

        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            min-width: 0;
            min-height: 0;
        }

        .operators-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            min-width: 0;
            min-height: 0;
        }

        button {
            border: none;
            border-radius: 24px;
            font-size: 2.2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        button:hover {
            filter: brightness(1.2);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        button:active {
            transform: scale(0.92);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
        }

        .btn-clear {
            background: linear-gradient(135deg, #ff0055, #ff5500);
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
        }

        .btn-ac {
            grid-column: span 2;
        }

        .btn-number {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-zero,
        .btn-dot {
            background: linear-gradient(135deg, #00f260, #0575e6);
        }

        .btn-zero {
            grid-column: span 2;
        }

        .btn-operator {
            background: linear-gradient(135deg, #ff9900, #ff5500);
        }

        .btn-equal {
            background: linear-gradient(135deg, #7f00ff, #e100ff);
            box-shadow: 0 0 20px rgba(225, 0, 255, 0.4);
        }

        .btn-equal:hover {
            box-shadow: 0 0 30px rgba(225, 0, 255, 0.7);
        }

        @media (min-width: 768px) {
            body {
                padding: 20px;
            }

            .calculator {
                width: 430px;
                height: 850px;
                max-height: 100%;
                border-radius: 24px;
                padding: 20px;
            }
        }

        @media (max-height: 600px) {
            .calculator {
                padding: 10px 10px 15px;
            }

            .display {
                height: 20vh;
                padding: 12px;
                margin-bottom: 10px;
                border-radius: 18px;
            }

            .buttons-area,
            .numbers-grid,
            .operators-grid {
                gap: 8px;
            }

            button {
                font-size: 1.6rem;
                border-radius: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="calculator">
        <div class="display">
            <div class="input-history" id="history"></div>
            <div class="output-result" id="result">0</div>
        </div>

        <div class="buttons-area">
            <div class="numbers-grid">
                <button class="btn-clear btn-ac" onclick="clearAll()">AC</button>
                <button class="btn-clear" onclick="backspace()">C</button>

                <button class="btn-number" onclick="pressKey('7')">7</button>
                <button class="btn-number" onclick="pressKey('8')">8</button>
                <button class="btn-number" onclick="pressKey('9')">9</button>

                <button class="btn-number" onclick="pressKey('4')">4</button>
                <button class="btn-number" onclick="pressKey('5')">5</button>
                <button class="btn-number" onclick="pressKey('6')">6</button>

                <button class="btn-number" onclick="pressKey('1')">1</button>
                <button class="btn-number" onclick="pressKey('2')">2</button>
                <button class="btn-number" onclick="pressKey('3')">3</button>

                <button class="btn-zero" onclick="pressKey('0')">0</button>
                <button class="btn-dot" onclick="pressKey('.')">.</button>
            </div>

            <div class="operators-grid">
                <button class="btn-operator" onclick="pressKey('/')">÷</button>
                <button class="btn-operator" onclick="pressKey('*')">×</button>
                <button class="btn-operator" onclick="pressKey('-')">−</button>
                <button class="btn-operator" onclick="pressKey('+')">+</button>
                <button class="btn-equal" onclick="calculateResult()">=</button>
            </div>
        </div>
    </div>

    <script>
        const historyDisplay = document.getElementById('history');
        const resultDisplay = document.getElementById('result');

        let currentInput = '';
        let isCalculated = false;

        const symbolMap = {
            '+': '+',
            '-': '-',
            '*': '×',
            '/': '÷'
        };

        function scrollToLatest() {
            requestAnimationFrame(() => {
                resultDisplay.scrollTop =
                    resultDisplay.scrollHeight - resultDisplay.clientHeight;

                historyDisplay.scrollTop =
                    historyDisplay.scrollHeight - historyDisplay.clientHeight;
            });
        }

        function updateDisplay() {
            let formattedStr = currentInput;

            Object.keys(symbolMap).forEach(key => {
                formattedStr = formattedStr.replaceAll(
                    key,
                    symbolMap[key]
                );
            });

            resultDisplay.innerText = formattedStr || '0';
            scrollToLatest();
        }

        function pressKey(val) {
            const operators = ['+', '-', '*', '/'];
            const isOperator = operators.includes(val);

            if (isCalculated) {
                if (!isOperator) {
                    currentInput = '';
                    historyDisplay.innerText = '';
                } else {
                    historyDisplay.innerText = currentInput;
                }

                isCalculated = false;
            }

            if (currentInput === '' && isOperator && val !== '-') {
                return;
            }

            if (isOperator) {
                const lastChar = currentInput.slice(-1);

                if (operators.includes(lastChar)) {
                    currentInput =
                        currentInput.slice(0, -1) + val;

                    updateDisplay();
                    return;
                }
            } else if (val === '.') {
                const parts = currentInput.split(/[\+\-\*\/]/);
                const currentNumberPart = parts[parts.length - 1];

                if (currentNumberPart.includes('.')) {
                    return;
                }
            }

            if (currentInput === '0' && val !== '.' && !isOperator) {
                currentInput = val;
            } else {
                currentInput += val;
            }

            updateDisplay();
        }

        function clearAll() {
            currentInput = '';
            historyDisplay.innerText = '';
            resultDisplay.innerText = '0';
            resultDisplay.scrollTop = 0;
            historyDisplay.scrollTop = 0;
            isCalculated = false;
        }

        function backspace() {
            if (isCalculated) {
                clearAll();
                return;
            }

            currentInput = currentInput.slice(0, -1);
            updateDisplay();
        }

        function calculateResult() {
            if (!currentInput) {
                return;
            }

            const operators = ['+', '-', '*', '/'];

            if (operators.includes(currentInput.slice(-1))) {
                currentInput = currentInput.slice(0, -1);
            }

            try {
                const rawInput = currentInput;

                let formattedHistory = currentInput;

                Object.keys(symbolMap).forEach(key => {
                    formattedHistory = formattedHistory.replaceAll(
                        key,
                        symbolMap[key]
                    );
                });

                historyDisplay.innerText = formattedHistory + ' =';

                const calculation = Function(
                    '"use strict";return (' + rawInput + ')'
                )();

                if (!isFinite(calculation)) {
                    resultDisplay.innerText = 'Error';
                    currentInput = '';
                    isCalculated = false;
                    scrollToLatest();
                    return;
                }

                const roundedCalculation =
                    Math.round(calculation * 1000000) / 1000000;

                currentInput = roundedCalculation.toString();
                resultDisplay.innerText = currentInput;
                isCalculated = true;

                scrollToLatest();

            } catch (error) {
                resultDisplay.innerText = 'Error';
                currentInput = '';
                isCalculated = false;
                scrollToLatest();
            }
        }

        document.addEventListener('keydown', function(event) {
            const key = event.key;

            if (/^[0-9.]$/.test(key)) {
                pressKey(key);
            } else if (['+', '-', '*', '/'].includes(key)) {
                pressKey(key);
            } else if (key === 'Enter' || key === '=') {
                calculateResult();
            } else if (key === 'Backspace') {
                backspace();
            } else if (
                key === 'Escape' ||
                key.toLowerCase() === 'c'
            ) {
                clearAll();
            }
        });
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(() => {
                        console.log('Service Worker Registered Properly!');
                    })
                    .catch((error) => {
                        console.log('Registration Failed!', error);
                    });
            });
        }
    </script>
</body>
</html>
