<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator - Xtron</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#E4861F">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculator {
            background-color: #1c1c1e;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 30px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5);
        }

        .display-container {
            width: 100%;
            height: 80px; 
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 20px;
            overflow: hidden;
            padding: 0 10px;
        }

        #display {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            text-align: right;
            font-size: 50px; 
            font-weight: 300;
            outline: none;
            white-space: nowrap;
            overflow: hidden;
            box-sizing: border-box;
            transition: font-size 0.05s ease;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        button {
            border: none;
            border-radius: 50%;
            aspect-ratio: 1;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.1s ease;
        }

        button:active {
            opacity: 0.7;
        }

        .btn-grey {
            background-color: #a5a5a5;
            color: #000000;
        }

        .btn-dark {
            background-color: #333333;
            color: #ffffff;
        }

        .btn-orange {
            background-color: #E4861F;
            color: #ffffff;
        }

        .btn-zero {
            grid-column: span 2;
            border-radius: 40px;
            aspect-ratio: auto;
            height: 100%;
            padding-left: 30px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="display-container">
            <input type="text" id="display" value="0" readonly>
        </div>
        <div class="buttons">
            <button class="btn-grey" onclick="clearDisplay()">AC</button>
            <button class="btn-grey" onclick="backspace()">C</button>
            <button class="btn-grey" onclick="appendValue('%')">%</button>
            <button class="btn-orange" onclick="appendValue('/')">÷</button>

            <button class="btn-dark" onclick="appendValue('7')">7</button>
            <button class="btn-dark" onclick="appendValue('8')">8</button>
            <button class="btn-dark" onclick="appendValue('9')">9</button>
            <button class="btn-orange" onclick="appendValue('*')">×</button>

            <button class="btn-dark" onclick="appendValue('4')">4</button>
            <button class="btn-dark" onclick="appendValue('5')">5</button>
            <button class="btn-dark" onclick="appendValue('6')">6</button>
            <button class="btn-orange" onclick="appendValue('-')">−</button>

            <button class="btn-dark" onclick="appendValue('1')">1</button>
            <button class="btn-dark" onclick="appendValue('2')">2</button>
            <button class="btn-dark" onclick="appendValue('3')">3</button>
            <button class="btn-orange" onclick="appendValue('+')">+</button>

            <button class="btn-dark btn-zero" onclick="appendValue('0')">0</button>
            <button class="btn-dark" onclick="appendValue('.')">.</button>
            <button class="btn-orange" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');

        function adjustFontSize() {
            const len = display.value.length;
            if (len <= 7) {
                display.style.fontSize = '50px';
            } else if (len > 7 && len <= 10) {
                display.style.fontSize = '40px';
            } else if (len > 10 && len <= 14) {
                display.style.fontSize = '30px';
            } else if (len > 14 && len <= 20) {
                display.style.fontSize = '22px';
            } else if (len > 20 && len <= 28) {
                display.style.fontSize = '16px';
            } else {
                display.style.fontSize = '12px';
            }
        }

        function appendValue(val) {
            if (display.value === '0' && !isNaN(val)) {
                display.value = val;
            } else {
                display.value += val;
            }
            adjustFontSize();
        }

        function clearDisplay() {
            display.value = '0';
            adjustFontSize();
        }

        function backspace() {
            if (display.value.length > 1) {
                display.value = display.value.slice(0, -1);
            } else {
                display.value = '0';
            }
            adjustFontSize();
        }

        function calculate() {
            try {
                let expression = display.value.replace(/×/g, '*').replace(/÷/g, '/');
                let result = eval(expression);
                display.value = Number(result.toFixed(8)).toString(); 
            } catch (error) {
                display.value = 'Error';
            }
            adjustFontSize();
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js').then(function(reg) {
                    console.log('SW Registered');
                }, function(err) {
                    console.log('SW Failed', err);
                });
            });
        }
    </script>
</body>
</html>
